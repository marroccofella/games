<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@TEROIDS — Arcade Word Shooter | 42.uk</title>
    <meta name="description" content="Rotate and thrust through an asteroid field, shoot rocks to release letters, collect words and use smart bombs.">
    <link rel="canonical" href="https://marroccofella.github.io/games/ateroids/play.html">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2214%22 font-size=%2214%22%3E🚀%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=5084565a7975">
</head>
<body>
    <a href="#game-container" class="skip-link">Skip to main content</a>
    <main id="game-container">
        <div id="hud">
            <div id="score-display" class="hud-block"></div>
            <div id="lives-display" class="hud-block"></div>
            <div id="high-score-display" class="hud-block"></div>
        </div>
        <div id="word-ui-bar">
            <div id="letter-rack"></div>
            <div id="words-display"></div>
            <div id="word-score-display">Word Score: 0</div>
        </div>
        <canvas id="gameCanvas" tabindex="0" aria-label="Asteroid word-shooter playfield"></canvas>
        <div id="start-screen" class="screen">
            <h1>@TEROIDS</h1>
            <p>Arrows move, Space fires, B uses a smart bomb. P or Escape pauses. This game is silent.</p>
            <button id="start-button">START GAME</button>
        </div>
        <div id="game-over" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>Your Score: <span id="final-score">0</span></p>
            <button id="restart-button">PLAY AGAIN</button>
        </div>
        <!-- Pause Overlay -->
        <div id="pause-overlay" class="screen hidden">
            <h1>PAUSED</h1>
            <button id="resume-button">RESUME</button>
        </div>
        <button id="pause-button" class="hud-button" disabled>Pause</button>
        <!-- Touch Controls (visible on touch devices) -->
        <div id="touch-controls" aria-label="Touch game controls">
            <button aria-label="Rotate left" data-key="ArrowLeft" class="touch-btn">⬅️</button>
            <button aria-label="Thrust" data-key="ArrowUp" class="touch-btn">⬆️</button>
            <button aria-label="Rotate right" data-key="ArrowRight" class="touch-btn">➡️</button>
            <button aria-label="Fire" data-key=" " class="touch-btn">🔫</button>
            <button aria-label="Smart bomb" data-key="b" class="touch-btn">💣</button>
        </div>
    </main>
    <nav class="backlinks"><a href="./">Game guide</a> · <a href="https://42.uk/library.html">42.uk Library</a></nav>
    <script src="game.js?v=4843218a6163"></script>
</body>
</html>
